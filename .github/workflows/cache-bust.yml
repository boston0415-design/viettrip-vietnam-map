name: Cache bust assets
on:
  push:
    paths:
      - '.github/workflows/cache-bust.yml'
permissions:
  contents: write
jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Add cache-busting version to static assets
        run: |
          python - <<'PY'
          from pathlib import Path
          p=Path('index.html')
          s=p.read_text()
          v='20260917-1608'
          s=s.replace('<!-- build: modular-source-v3-20260917 -->', f'<!-- build: modular-source-v4-{v} -->')
          for f in ['assets/css/base.css','assets/css/responsive.css']:
              s=s.replace(f'./{f}"', f'./{f}?v={v}"')
          for i in range(1,11):
              f=f'assets/js/{i:02d}-'+[
                'data-storage.js','services-media.js','business-ui.js','rendering.js','places-registration.js','save-motion.js','ranges-categories.js','search-audit.js','init-events.js','runtime-guard.js'
              ][i-1]
              s=s.replace(f'./{f}"', f'./{f}?v={v}"')
          p.write_text(s)
          PY
          git config user.name "boston0415-design"
          git config user.email "boston0415@gmail.com"
          git add index.html
          git commit -m "Force fresh static assets for registered businesses"
          git push
