name: Panel interaction validation
on:
  push:
    branches: ['fix/panel-interaction-review-safety']
permissions:
  contents: write
concurrency:
  group: panel-interaction-validation
  cancel-in-progress: false
jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/panel-interaction-review-safety
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Apply checksum-verified panel source patch
        run: |
          python3 - <<'PY'
          import pathlib,gzip,base64,hashlib,subprocess
          parts=[pathlib.Path('scripts/panel-fix.'+str(i)) for i in (1,2)]
          if parts[0].exists():
              patch=gzip.decompress(base64.b64decode(''.join(p.read_text().strip() for p in parts)))
              assert hashlib.sha256(patch).hexdigest()=='f1a501edf726efbe942701e7fa206a1d08593a0054285ff4e046ff53e7b1328a','Source checksum mismatch'
              subprocess.run(['git','apply','--unidiff-zero','--check','-'],input=patch,check=True)
              subprocess.run(['git','apply','--unidiff-zero','-'],input=patch,check=True)
              for p in parts:p.unlink()
          PY
      - name: Syntax and build
        run: |
          find assets/js -name '*.js' -print0 | xargs -0 -n1 node --check
          node scripts/build-pages.mjs
      - name: Install isolated test dependencies
        run: |
          npm install --no-save --package-lock=false jsdom@26.1.0 playwright@1.55.0
          npx playwright install chromium --with-deps
      - name: All regression files including review and location safety
        run: |
          mkdir -p test-results
          failed=0
          for test in tests/*.test.cjs; do
            echo "===== $test =====" | tee -a test-results/existing-tests.log
            if ! timeout 45 node "$test" >>test-results/existing-tests.log 2>&1; then
              echo "FAILED: $test" | tee -a test-results/existing-tests.log
              failed=1
            fi
          done
          cat test-results/existing-tests.log
          exit "$failed"
      - name: Desktop and emulated mobile interaction tests
        if: success() || failure()
        run: node scripts/test-map-ux.cjs
      - name: Commit verified conventional source only
        if: success()
        run: |
          git add -A -- AGENTS.md assets index.html scripts tests
          if ! git diff --cached --quiet; then
            git config user.name 'github-actions[bot]'
            git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
            git commit -m 'Enable whole-panel gestures and protect review display and editing; improve location acquisition'
            git push origin HEAD:fix/panel-interaction-review-safety
          fi
          git rev-parse HEAD > test-results/tested-commit.txt
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: panel-interaction-results
          path: test-results/
          if-no-files-found: ignore
          retention-days: 7
