name: Fix shared DB loading
on:
  push:
    paths:
      - '.github/workflows/fix-shared-db.yml'
permissions:
  contents: write
jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - name: Patch resilient shared DB loader
        shell: python
        run: |
          from pathlib import Path
          p=Path('assets/js/02-services-media.js')
          s=p.read_text(encoding='utf-8')
          old="""async function fetchSharedDb(){
            const [places,reviews]=await Promise.all([
              supaGet('places_public','select=*&order=created_at.asc'),
              supaGet('reviews','select=*&order=created_at.asc')
            ]);
            return dedupeDbData({
              places:places.map(remotePlaceToLocal),
              reviews:reviews.map(remoteReviewToLocal)
            });
          }
          """
          new="""async function fetchSharedDb(){
            // 업체와 후기 로딩을 분리한다.
            // 후기 API가 일시적으로 실패해도 업체 목록/지도 마커는 반드시 표시한다.
            let places=[];
            let reviews=[];
            let placeError=null;

            try{
              places=await supaGet('places_public','select=*&order=created_at.asc');
            }catch(err){
              placeError=err;
              console.warn('places_public load failed; trying public places fallback',err);
              try{
                places=await supaGet(
                  'places',
                  'select=id,name,category,subcategory,area,address,lat,lng,description,initial_rating,member_benefit,benefit_text,photo_urls,tags,created_at,updated_at&order=created_at.asc'
                );
                placeError=null;
              }catch(fallbackErr){
                console.error('places fallback load failed',fallbackErr);
                placeError=fallbackErr;
              }
            }

            if(placeError)throw placeError;

            try{
              reviews=await supaGet('reviews','select=*&order=created_at.asc');
            }catch(err){
              console.warn('reviews load failed; businesses will still be shown',err);
              reviews=[];
            }

            return dedupeDbData({
              places:(places||[]).map(remotePlaceToLocal),
              reviews:(reviews||[]).map(remoteReviewToLocal)
            });
          }
          """
          if old not in s:
            raise SystemExit('target fetchSharedDb block not found')
          p.write_text(s.replace(old,new,1),encoding='utf-8')
      - name: Verify JavaScript
        run: node --check assets/js/02-services-media.js
      - name: Commit repaired source
        run: |
          git config user.name 'boston0415-design'
          git config user.email 'boston0415@gmail.com'
          git add assets/js/02-services-media.js
          git commit -m 'Fix shared business loading permanently [skip ci]'
          git push origin main
