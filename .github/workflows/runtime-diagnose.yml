name: Runtime diagnose

on:
  push:
    paths:
      - '.github/workflows/runtime-diagnose.yml'

jobs:
  diagnose:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install Playwright
        run: |
          npm init -y >/dev/null 2>&1
          npm install playwright@1.55.0 --no-save
          npx playwright install chromium --with-deps
      - name: Inspect live site
        run: |
          cat > diag.cjs <<'NODE'
          const { chromium } = require('playwright');
          (async()=>{
            const browser=await chromium.launch({headless:true});
            const page=await browser.newPage({viewport:{width:1365,height:900}});
            page.on('console',m=>{
              if(['error','warning'].includes(m.type())) console.log('CONSOLE',m.type(),m.text());
            });
            page.on('pageerror',e=>console.log('PAGEERROR',e.message));
            page.on('response',r=>{
              const u=r.url();
              if(u.includes('supabase.co/rest/v1/')) console.log('API',r.status(),u.split('?')[0]);
            });
            await page.goto('https://ornate-tarsier-b1a553.netlify.app/?diag=1',{waitUntil:'domcontentloaded',timeout:60000});
            await page.waitForTimeout(10000);
            const info=await page.evaluate(()=>({
              countText:document.querySelector('#count')?.textContent||'',
              mobileCount:document.querySelector('#mobileListCount')?.textContent||'',
              cards:document.querySelectorAll('#list [data-id]').length,
              listText:(document.querySelector('#list')?.innerText||'').slice(0,1000),
              mapState:document.querySelector('#mapLoadTitle')?.textContent||'',
              hasState:typeof state!=='undefined',
              city:typeof state!=='undefined'?state.city:null,
              cachePlaces:typeof db==='function'?(db().places||[]).length:null,
              cityPlaces:typeof placesForCurrentCity==='function'?placesForCurrentCity().length:null,
              itemCount:typeof items==='function'?items().length:null,
              hasFetchShared:typeof fetchSharedDb==='function',
              hasGuard:typeof window.ensureSharedBusinesses==='function'
            }));
            console.log('DIAG',JSON.stringify(info));
            await page.screenshot({path:'runtime.png',fullPage:true});
            await browser.close();
            if(info.cards<1) process.exitCode=2;
          })().catch(e=>{console.error('DIAG_FATAL',e);process.exit(3)});
          NODE
          node diag.cjs
      - name: Upload screenshot
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: runtime-screenshot
          path: runtime.png
