name: Runtime diagnose

on:
  push:
    paths:
      - '.github/workflows/runtime-diagnose.yml'

jobs:
  diagnose:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install Playwright
        run: |
          npm init -y >/dev/null 2>&1
          npm install playwright@1.55.0 --no-save
          npx playwright install chromium --with-deps
      - name: Inspect mobile live site
        run: |
          cat > diag.cjs <<'NODE'
          const { chromium } = require('playwright');
          (async()=>{
            const browser=await chromium.launch({headless:true});
            const page=await browser.newPage({
              viewport:{width:390,height:844},
              isMobile:true,
              hasTouch:true,
              deviceScaleFactor:2
            });
            page.on('console',m=>{
              if(['error','warning'].includes(m.type())) console.log('CONSOLE',m.type(),m.text());
            });
            page.on('pageerror',e=>console.log('PAGEERROR',e.message));
            page.on('response',r=>{
              const u=r.url();
              if(u.includes('supabase.co/rest/v1/')) console.log('API',r.status(),u.split('?')[0]);
            });
            await page.goto('https://ornate-tarsier-b1a553.netlify.app/?mobile_diag=1',{waitUntil:'domcontentloaded',timeout:60000});
            await page.waitForTimeout(10000);
            const before=await page.evaluate(()=>({
              countText:document.querySelector('#count')?.textContent||'',
              mobileCount:document.querySelector('#mobileListCount')?.textContent||'',
              cards:document.querySelectorAll('#list .card, #list [data-id]').length,
              mapExists:!!(typeof state!=='undefined'&&state.map),
              markers:typeof state!=='undefined'?(state.markers||[]).length:null,
              cachePlaces:typeof db==='function'?(db().places||[]).length:null,
              cityPlaces:typeof placesForCurrentCity==='function'?placesForCurrentCity().length:null,
              itemCount:typeof items==='function'?items().length:null,
              mapOverlayClass:document.querySelector('#mapLoadState')?.className||'',
              listSideClass:document.querySelector('#businessSide')?.className||'',
              listButtonDisplay:getComputedStyle(document.querySelector('#mobileListBtn')).display
            }));
            console.log('MOBILE_BEFORE',JSON.stringify(before));
            const btn=page.locator('#mobileListBtn');
            if(await btn.count()) await btn.click({force:true});
            await page.waitForTimeout(800);
            const after=await page.evaluate(()=>({
              listSideClass:document.querySelector('#businessSide')?.className||'',
              listDisplay:getComputedStyle(document.querySelector('#businessSide')).display,
              listTransform:getComputedStyle(document.querySelector('#businessSide')).transform,
              listRect:(()=>{const r=document.querySelector('#businessSide').getBoundingClientRect();return {x:r.x,y:r.y,w:r.width,h:r.height}})(),
              cards:document.querySelectorAll('#list .card, #list [data-id]').length,
              listText:(document.querySelector('#list')?.innerText||'').slice(0,800)
            }));
            console.log('MOBILE_AFTER',JSON.stringify(after));
            await page.screenshot({path:'runtime-mobile.png',fullPage:true});
            await browser.close();
            if(before.itemCount<1) process.exitCode=2;
          })().catch(e=>{console.error('DIAG_FATAL',e);process.exit(3)});
          NODE
          node diag.cjs
      - name: Upload screenshot
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: runtime-mobile-screenshot
          path: runtime-mobile.png
