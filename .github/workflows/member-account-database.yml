name: Member account database
on:
  push:
    branches: ['main', 'codex/browse-member-accounts']
    paths: ['supabase/**', 'database/**', 'tests/member-account*.sql', '.github/workflows/member-account-database.yml']
permissions:
  contents: read
jobs:
  account-permissions:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_PASSWORD: isolated-ci-only
          POSTGRES_DB: account_test
        ports: ['5432:5432']
        options: >-
          --health-cmd pg_isready
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    steps:
      - uses: actions/checkout@v4
      - name: Verify account ownership in isolated PostgreSQL
        env:
          PGHOST: localhost
          PGPORT: 5432
          PGUSER: postgres
          PGPASSWORD: isolated-ci-only
          PGDATABASE: account_test
        run: |
          psql -v ON_ERROR_STOP=1 -f tests/member-account-bootstrap.sql
          psql -v ON_ERROR_STOP=1 -f supabase/migrations/20260920072936_map_membership_grades.sql
          psql -v ON_ERROR_STOP=1 -f supabase/migrations/20261003100018_member_accounts.sql
          psql -v ON_ERROR_STOP=1 -f tests/member-account.sql
