name: Sticky panel header validation
on:
  push:
    branches: ['fix/sticky-panel-header']
permissions:
  contents: read
jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Export exact source
        run: git archive --format=zip -o source.zip HEAD
      - uses: actions/upload-artifact@v4
        with:
          name: sticky-header-source
          path: source.zip
          retention-days: 2
      - name: Run regression tests when header fix is present
        run: |
          if grep -q 'Anchored sheet headers' assets/css/panel-comfort.css; then
            npm install --no-save --package-lock=false jsdom@26.1.0 playwright@1.55.0
            npx playwright install chromium --with-deps
            find assets/js -name '*.js' -print0 | xargs -0 -n1 node --check
            node scripts/build-pages.mjs
            for test in tests/*.test.cjs; do timeout 45 node "$test"; done
            node scripts/test-map-ux.cjs
          fi
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: sticky-header-tests
          path: test-results/
          if-no-files-found: ignore
          retention-days: 7
