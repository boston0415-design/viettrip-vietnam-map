name: Sticky panel header validation
on:
  push:
    branches: ['fix/sticky-panel-header']
permissions:
  contents: write
jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Apply exact source patch
        run: |
          python3 - <<'PY'
          import pathlib, base64, gzip, hashlib, subprocess
          p=pathlib.Path('scripts/sticky-headers.patch.gz.b64')
          if p.exists():
              patch=gzip.decompress(base64.b64decode(p.read_text()))
              assert hashlib.sha256(patch).hexdigest()=='867a4d632b7b54abf941fd2ecdb54f5d091c490361abff5dd87d038cc616ac87'
              subprocess.run(['git','apply','--check','-'],input=patch,check=True)
              subprocess.run(['git','apply','-'],input=patch,check=True)
              p.unlink()
          PY
      - name: Install isolated test dependencies
        run: |
          npm install --no-save --package-lock=false jsdom@26.1.0 playwright@1.55.0
          npx playwright install chromium --with-deps
      - name: Syntax, build and regression tests
        run: |
          find assets/js -name '*.js' -print0 | xargs -0 -n1 node --check
          node scripts/build-pages.mjs
          mkdir -p test-results
          for test in tests/*.test.cjs; do
            echo "===== $test =====" >>test-results/existing-tests.log
            timeout 45 node "$test" >>test-results/existing-tests.log 2>&1
          done
          node scripts/test-map-ux.cjs
      - name: Commit tested header source only
        if: success()
        run: |
          git add -A -- AGENTS.md assets/css/panel-comfort.css index.html scripts
          if ! git diff --cached --quiet; then
            git config user.name 'github-actions[bot]'
            git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
            git commit -m 'Anchor map list and detail headers while preserving whole-panel drag'
            git push origin HEAD:fix/sticky-panel-header
          fi
          git rev-parse HEAD >test-results/tested-commit.txt
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: sticky-header-tests
          path: test-results/
          if-no-files-found: ignore
          retention-days: 7
