<!doctype html><html lang="ko"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>일상탈출 베트남맵</title><style>html,body{margin:0;height:100%;font-family:system-ui,sans-serif}body{display:flex;align-items:center;justify-content:center;background:#f5f6f8;color:#334155}.card{background:white;padding:22px 24px;border-radius:18px;box-shadow:0 12px 30px rgba(0,0,0,.10);text-align:center}</style></head><body><div class="card"><b>일상탈출 베트남맵 불러오는 중…</b></div><script>(async()=>{try{const files=['gzip/00.txt','gzip/01.txt','gzip/02.txt','gzip/03.txt','gzip/04.txt','gzip/05.txt','gzip/06.txt','gzip/07.txt','gzip/08.txt','gzip/09.txt','gzip/10.txt','gzip/11.txt','gzip/12.txt','gzip/13.txt','gzip/14.txt'];let b='';for(const f of files){const r=await fetch(f,{cache:'no-store'});if(!r.ok)throw new Error(f+' '+r.status);b+=await r.text();}const bin=atob(b),bytes=new Uint8Array(bin.length);for(let i=0;i<bin.length;i++)bytes[i]=bin.charCodeAt(i);const ds=new DecompressionStream('gzip');let html=await new Response(new Blob([bytes]).stream().pipeThrough(ds)).text();html=html.replace('</body>','<script src="./hotfix.js?v=20260917-0608"><\/script></body>');document.open();document.write(html);document.close();}catch(e){console.error(e);document.body.innerHTML='<div class="card"><b>사이트 로딩 오류</b><br><button onclick="location.reload()" style="margin-top:12px;padding:10px 14px">다시 시도</button></div>';}})();</script></body></html>
