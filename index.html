<!doctype html><html lang="ko"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>일상탈출 베트남맵</title><style>html,body{margin:0;height:100%;font-family:system-ui,sans-serif}body{display:flex;align-items:center;justify-content:center;background:#f5f6f8;color:#334155}.card{background:white;padding:22px 24px;border-radius:18px;box-shadow:0 12px 30px rgba(0,0,0,.10);text-align:center}.dot{width:32px;height:32px;border:4px solid #dbeafe;border-top-color:#1a73e8;border-radius:50%;margin:0 auto 12px;animation:s 1s linear infinite}@keyframes s{to{transform:rotate(360deg)}}</style></head><body><div class="card"><div class="dot"></div><b>일상탈출 베트남맵 불러오는 중…</b></div><script>(async()=>{try{const files=["00.txt","01.txt","02.txt","03.txt","04.txt","05.txt","06.txt","07.txt","08.txt","09.txt","10.txt","11.txt","12.txt","13.txt","14.txt","15.txt","16.txt","17.txt"];let b='';for(const f of files){const r=await fetch('./chunks/'+f,{cache:'no-store'});if(!r.ok)throw new Error('chunk '+f);b+=await r.text();}const bin=atob(b);const bytes=new Uint8Array(bin.length);for(let i=0;i<bin.length;i++)bytes[i]=bin.charCodeAt(i);const html=new TextDecoder('utf-8').decode(bytes);document.open();document.write(html);document.close();}catch(e){document.body.innerHTML='<div class="card"><b>사이트를 불러오지 못했습니다.</b><br><button onclick="location.reload()" style="margin-top:12px;padding:10px 14px">다시 시도</button></div>';console.error(e);}})();</script></body></html>
