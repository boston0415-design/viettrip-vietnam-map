  <details class=&quot;memberSection&quot;><summary>어떤 활동이 인정되나요?</summary><ul class=&quot;memberRules&quot;><li>이름·주소·위치가 있는 새 업소 등록: 업소별 1건</li><li>10자 이상으로 경험을 남긴 방문 후기: 업소별 1건. 별점이 낮아도 동일하게 인정합니다.</li><li>관리자가 확인한 정보 수정 제안: 업소·항목별 1건</li><li>같은 내용의 반복 후기, 중복 업소, 단순 수정·사진 추가는 건수를 늘리지 않습니다.</li><li>별점만 남기기·강추·조회·출석·공유에는 기여가 적립되지 않습니다.</li><li>삭제되거나 허위·도배로 인정이 취소된 기록은 제외됩니다. 등급은 후기의 정확성을 보증하지 않습니다.</li></ul></details>
