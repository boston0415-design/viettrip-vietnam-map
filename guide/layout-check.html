    &lt;div class=&quot;field&quot;&gt;&lt;label&gt;설명&lt;/label&gt;&lt;textarea id=&quot;pDesc&quot;&gt;&lt;/textarea&gt;&lt;/div&gt;
    &lt;div class=&quot;field photoPicker&quot;&gt;
      &lt;label&gt;업체 사진 · 최대 5장&lt;/label&gt;
      &lt;input id=&quot;pPhotos&quot; type=&quot;file&quot; accept=&quot;image/*&quot; multiple=&quot;&quot;&gt;
      &lt;div class=&quot;photoHelp&quot;&gt;사진은 자동으로 WebP 압축됩니다. 기존 업체 수정에서도 사진 추가·교체·삭제가 가능합니다.&lt;/div&gt;
      &lt;div id=&quot;pPhotoPreview&quot; class=&quot;placePhotoPreview&quot;&gt;&lt;/div&gt;
      &lt;div id=&quot;pPhotoCount&quot; class=&quot;placePhotoCount&quot;&gt;&lt;/div&gt;

    &lt;div id=&quot;placeSaveStatus&quot; class=&quot;inlineHelp&quot; style=&quot;margin-top:8px;min-height:18px&quot;&gt;&lt;/div&gt;&lt;div class=&quot;modalactions&quot;&gt;&lt;button class=&quot;btn&quot; data-close=&quot;placeModal&quot; type=&quot;button&quot;&gt;취소&lt;/button&gt;&lt;button id=&quot;savePlace&quot; class=&quot;btn primary&quot; type=&quot;button&quot;&gt;등록&lt;/button&gt;&lt;/div&gt;

&lt;div id=&quot;reviewModal&quot; class=&quot;modalback&quot; role=&quot;dialog&quot; aria-modal=&quot;true&quot; aria-labelledby=&quot;reviewEditorTitle&quot;&gt;
  &lt;div class=&quot;modal&quot; data-no-sheet-resize=&quot;&quot;&gt;
    &lt;div class=&quot;reviewEditorHeader&quot;&gt;&lt;h3 id=&quot;reviewEditorTitle&quot;&gt;별점·후기 남기기&lt;/h3&gt;&lt;button type=&quot;button&quot; id=&quot;reviewEditorClose&quot; data-close=&quot;reviewModal&quot; aria-label=&quot;별점·후기 수정 창 닫기&quot;&gt;×&lt;/button&gt;&lt;/div&gt;
    &lt;p id=&quot;reviewPlaceName&quot; class=&quot;reviewPlaceName&quot;&gt;&lt;/p&gt;
    &lt;p id=&quot;reviewSaveStatus&quot; role=&quot;status&quot; aria-live=&quot;polite&quot;&gt;&lt;/p&gt;
    &lt;p style=&quot;font-size:12px;color:#64748b&quot;&gt;별점만 또는 후기만 등록할 수 있습니다. 같은 기기·브라우저에서는 업소별로 각각 1개만 저장되며, 다시 작성하면 기존 내용이 수정됩니다.&lt;/p&gt;
    &lt;div class=&quot;field&quot;&gt;&lt;label for=&quot;rName&quot;&gt;닉네임 · 글 후기 작성 시 필수&lt;/label&gt;&lt;input id=&quot;rName&quot; name=&quot;nickname&quot; autocomplete=&quot;nickname&quot; maxlength=&quot;30&quot; placeholder=&quot;카페에서 사용하는 닉네임을 적어주세요&quot; aria-describedby=&quot;rNameHelp&quot;&gt;&lt;div id=&quot;rNameHelp&quot; class=&quot;inlineHelp&quot;&gt;이 브라우저에 닉네임을 기억합니다. 후기에 공개되며, 별점만 남길 때는 생략할 수 있습니다.&lt;/div&gt;&lt;/div&gt;
    &lt;div class=&quot;field&quot;&gt;&lt;label&gt;별점 · 선택&lt;/label&gt;&lt;div id=&quot;stars&quot; class=&quot;stars&quot;&gt;&lt;/div&gt;&lt;div style=&quot;font-size:11px;color:#64748b;margin-top:6px&quot;&gt;입력하지 않은 항목의 기존 별점·후기는 그대로 유지됩니다.&lt;/div&gt;&lt;/div&gt;
    &lt;div class=&quot;field&quot;&gt;&lt;label class=&quot;recommendChoice&quot; for=&quot;rRecommended&quot;&gt;&lt;input id=&quot;rRecommended&quot; type=&quot;checkbox&quot;&gt; 👍 강추업소&lt;/label&gt;&lt;div class=&quot;inlineHelp&quot;&gt;별점·후기와 함께 추천할 수 있습니다. 다시 평가할 때 해제할 수 있습니다.&lt;/div&gt;&lt;/div&gt;
    &lt;div class=&quot;field&quot;&gt;&lt;label for=&quot;rText&quot;&gt;후기 · 선택&lt;/label&gt;&lt;textarea id=&quot;rText&quot; placeholder=&quot;후기만 남겨도 됩니다.&quot;&gt;&lt;/textarea&gt;&lt;/div&gt;
    &lt;details id=&quot;reviewCafeLink&quot; class=&quot;reviewCafeLink&quot;&gt;
      &lt;summary&gt;카페 후기 링크 추가하기 · 선택&lt;/summary&gt;
      &lt;div class=&quot;field&quot;&gt;&lt;label for=&quot;rCafeUrl&quot;&gt;네이버 카페 게시글 주소&lt;/label&gt;&lt;input id=&quot;rCafeUrl&quot; type=&quot;url&quot; inputmode=&quot;url&quot; placeholder=&quot;네이버 카페에서 복사한 주소를 붙여주세요&quot; aria-describedby=&quot;rCafeHelp&quot;&gt;&lt;div id=&quot;rCafeHelp&quot; class=&quot;inlineHelp&quot;&gt;일상탈출 카페 글의 ‘URL 복사’ 주소를 붙여주세요. naver.me 단축 주소도 사용할 수 있습니다. 간단한 후기와 함께 저장하면 원문으로 연결됩니다. 회원 전용 글은 카페 가입·로그인이 필요할 수 있습니다.&lt;/div&gt;&lt;/div&gt;
    &lt;/details&gt;
    &lt;div class=&quot;field photoPicker&quot;&gt;
      &lt;label&gt;사진 · 최대 3장&lt;/label&gt;
      &lt;input id=&quot;rPhotos&quot; type=&quot;file&quot; accept=&quot;image/*&quot; multiple=&quot;&quot;&gt;
      &lt;div class=&quot;photoHelp&quot;&gt;휴대폰 원본은 자동으로 WebP 압축합니다. 긴 변 1024px, 보통 1장 약 100~500KB 수준입니다.&lt;/div&gt;
      &lt;div id=&quot;rPhotoPreview&quot; class=&quot;photoPreview&quot;&gt;&lt;/div&gt;
    &lt;/div&gt;
    &lt;div class=&quot;modalactions&quot;&gt;&lt;button class=&quot;btn&quot; data-close=&quot;reviewModal&quot;&gt;취소&lt;/button&gt;&lt;button id=&quot;saveReview&quot; class=&quot;btn primary&quot;&gt;저장&lt;/button&gt;&lt;/div&gt;
  &lt;/div&gt;
&lt;/div&gt;

&lt;dialog id=&quot;communityReviewsDialog&quot; class=&quot;travellerDialog&quot; aria-labelledby=&quot;communityReviewsTitle&quot;&gt;
  &lt;div class=&quot;travellerDialogHead&quot;&gt;&lt;div&gt;&lt;h2 id=&quot;communityReviewsTitle&quot;&gt;회원 후기&lt;/h2&gt;&lt;p&gt;전체 지역의 방문 후기 · 최근 작성순&lt;/p&gt;&lt;/div&gt;&lt;button type=&quot;button&quot; data-traveller-close=&quot;&quot; aria-label=&quot;후기 창 닫기&quot;&gt;×&lt;/button&gt;&lt;/div&gt;
  &lt;div id=&quot;communityReviewFeed&quot; aria-live=&quot;polite&quot;&gt;&lt;/div&gt;

  &lt;button id=&quot;moreCommunityReviews&quot; class=&quot;btn&quot; type=&quot;button&quot; hidden=&quot;&quot;&gt;후기 더 보기&lt;/button&gt;
&lt;/dialog&gt;
&lt;dialog id=&quot;transportGuideDialog&quot; class=&quot;travellerDialog&quot; aria-labelledby=&quot;transportGuideTitle&quot;&gt;
  &lt;div class=&quot;travellerDialogHead&quot;&gt;&lt;div&gt;&lt;h2 id=&quot;transportGuideTitle&quot;&gt;처음 가는 베트남, 이동 안내&lt;/h2&gt;&lt;p&gt;공항에서 숙소까지 차근차근&lt;/p&gt;&lt;/div&gt;&lt;button type=&quot;button&quot; data-traveller-close=&quot;&quot; aria-label=&quot;교통 안내 닫기&quot;&gt;×&lt;/button&gt;&lt;/div&gt;
  &lt;label for=&quot;transportCity&quot;&gt;여행 지역&lt;/label&gt;&lt;select id=&quot;transportCity&quot;&gt;&lt;/select&gt;
  &lt;div id=&quot;transportGuideBody&quot;&gt;&lt;/div&gt;
&lt;/dialog&gt;

&lt;dialog id=&quot;bookingInquiryDialog&quot; class=&quot;travellerDialog bookingInquiryDialog&quot; aria-labelledby=&quot;bookingInquiryTitle&quot; aria-describedby=&quot;bookingInquiryIntro&quot;&gt;
  &lt;div class=&quot;travellerDialogHead&quot;&gt;&lt;div&gt;&lt;h2 id=&quot;bookingInquiryTitle&quot;&gt;예약 문의&lt;/h2&gt;&lt;p&gt;업소가 안내한 연락처로 연결합니다&lt;/p&gt;&lt;/div&gt;&lt;button id=&quot;closeBookingInquiry&quot; type=&quot;button&quot; aria-label=&quot;예약 문의 창 닫기&quot;&gt;×&lt;/button&gt;&lt;/div&gt;
  &lt;h3 id=&quot;bookingInquiryPlace&quot;&gt;&lt;/h3&gt;
  &lt;p id=&quot;bookingInquiryAddress&quot;&gt;&lt;/p&gt;
  &lt;p id=&quot;bookingInquiryIntro&quot;&gt;방문 날짜·시간·인원과 원하는 서비스를 알려주세요. &lt;strong&gt;업소의 확정 답변을 받아야 예약이 완료됩니다.&lt;/strong&gt;&lt;/p&gt;
  &lt;div id=&quot;bookingInquiryChannels&quot; aria-label=&quot;예약 문의 방법&quot;&gt;&lt;/div&gt;
  &lt;p id=&quot;bookingInquiryNote&quot;&gt;&lt;/p&gt;
  &lt;p class=&quot;bookingInquiryHelp&quot;&gt;채팅 앱은 설치·로그인이 필요할 수 있어요. 연결이 안 되면 다른 문의 방법을 선택해 주세요.&lt;/p&gt;
  &lt;div class=&quot;bookingInquirySource&quot;&gt;&lt;a id=&quot;bookingInquirySource&quot; target=&quot;_blank&quot; rel=&quot;noopener noreferrer&quot;&gt;공식 연락처 안내 ↗&lt;/a&gt;&lt;span id=&quot;bookingInquiryChecked&quot;&gt;&lt;/span&gt;&lt;/div&gt;
  &lt;p id=&quot;bookingInquiryStatus&quot; role=&quot;status&quot; aria-live=&quot;polite&quot;&gt;&lt;/p&gt;
&lt;/dialog&gt;

&lt;dialog id=&quot;businessShareDialog&quot; class=&quot;travellerDialog businessShareDialog&quot; aria-labelledby=&quot;businessShareTitle&quot; aria-describedby=&quot;businessShareHint&quot;&gt;
  &lt;div class=&quot;travellerDialogHead&quot;&gt;&lt;h2 id=&quot;businessShareTitle&quot;&gt;공유·복사&lt;/h2&gt;&lt;button id=&quot;businessShareClose&quot; type=&quot;button&quot; aria-label=&quot;공유 창 닫기&quot;&gt;×&lt;/button&gt;&lt;/div&gt;
  &lt;p id=&quot;businessSharePlace&quot;&gt;&lt;/p&gt;
  &lt;div id=&quot;businessShareOptions&quot; role=&quot;group&quot; aria-label=&quot;공유·복사 방법&quot;&gt;&lt;/div&gt;
  &lt;p id=&quot;businessShareHint&quot;&gt;카페에 공유를 누르면 업소명·주소·지도 링크가 복사됩니다. 카페 글에 붙여넣어 주세요.&lt;/p&gt;
&lt;/dialog&gt;

&lt;dialog id=&quot;homeScreenDialog&quot; class=&quot;travellerDialog homeScreenDialog&quot; aria-labelledby=&quot;homeScreenTitle&quot; aria-describedby=&quot;homeScreenIntro&quot;&gt;
  &lt;div class=&quot;travellerDialogHead&quot;&gt;
    &lt;div class=&quot;homeScreenIdentity&quot;&gt;&lt;img src=&quot;/assets/icons/vietmap-192.png?v=20261006-brand2&quot; alt=&quot;베트남맵 홈 화면 아이콘&quot; width=&quot;62&quot; height=&quot;62&quot;&gt;&lt;div&gt;&lt;h2 id=&quot;homeScreenTitle&quot;&gt;베트남맵을 홈 화면에&lt;/h2&gt;&lt;p&gt;일상탈출 · 언제든, 한 번에&lt;/p&gt;&lt;/div&gt;&lt;/div&gt;
    &lt;button id=&quot;closeHomeScreen&quot; type=&quot;button&quot; aria-label=&quot;홈 화면 추가 안내 닫기&quot;&gt;×&lt;/button&gt;
  &lt;/div&gt;
  &lt;p id=&quot;homeScreenIntro&quot; class=&quot;homeScreenIntro&quot;&gt;홈 화면에 추가한 아이콘을 누르면 지도가 바로 열립니다. 인터넷에 연결하면 열 때와 화면으로 돌아올 때 업소·후기를 다시 불러옵니다.&lt;/p&gt;
  &lt;dl class=&quot;homeScreenTrust&quot; aria-label=&quot;이용 방식·권한·공식 주소&quot;&gt;
    &lt;div&gt;&lt;dt&gt;이용 방식&lt;/dt&gt;&lt;dd&gt;브라우저의 홈 화면 추가 기능입니다. 별도 APK 파일을 받을 필요가 없고, 추가 없이도 웹에서 이용할 수 있어요.&lt;/dd&gt;&lt;/div&gt;
    &lt;div&gt;&lt;dt&gt;권한&lt;/dt&gt;&lt;dd&gt;‘내 위치’를 누를 때 위치 권한을 확인합니다. 홈 화면 추가 자체는 연락처·문자 권한을 요청하지 않아요.&lt;/dd&gt;&lt;/div&gt;
    &lt;div&gt;&lt;dt&gt;공식 주소&lt;/dt&gt;&lt;dd&gt;&lt;a href=&quot;https://viettrip-vietnam-map.pages.dev/&quot; target=&quot;_blank&quot; rel=&quot;noopener noreferrer&quot;&gt;viettrip-vietnam-map.pages.dev&lt;/a&gt;&lt;span&gt;일상탈출 카페에 안내된 주소와 확인해 주세요.&lt;/span&gt;&lt;/dd&gt;&lt;/div&gt;
  &lt;/dl&gt;
  &lt;p id=&quot;homeScreenInApp&quot; class=&quot;homeScreenNotice&quot; hidden=&quot;&quot;&gt;카페·카카오톡 안에서는 추가 메뉴가 없을 수 있어요. 메뉴의 &lt;strong&gt;다른 브라우저로 열기&lt;/strong&gt;를 누르거나, 아래 지도 주소를 복사해 Chrome 또는 Safari에서 열어주세요.&lt;/p&gt;
  &lt;button id=&quot;homeScreenInstall&quot; class=&quot;homeScreenInstall&quot; type=&quot;button&quot; hidden=&quot;&quot;&gt;이 기기에 베트남맵 추가&lt;/button&gt;
  &lt;p id=&quot;homeScreenStatus&quot; class=&quot;homeScreenStatus&quot; role=&quot;status&quot; aria-live=&quot;polite&quot; hidden=&quot;&quot;&gt;&lt;/p&gt;
  &lt;div class=&quot;homeScreenPlatforms&quot; role=&quot;group&quot; aria-label=&quot;기기별 홈 화면 추가 방법&quot;&gt;
    &lt;button type=&quot;button&quot; data-home-platform=&quot;android&quot; aria-pressed=&quot;true&quot;&gt;안드로이드&lt;/button&gt;
    &lt;button type=&quot;button&quot; data-home-platform=&quot;ios&quot; aria-pressed=&quot;false&quot;&gt;아이폰&lt;/button&gt;
    &lt;button type=&quot;button&quot; data-home-platform=&quot;desktop&quot; aria-pressed=&quot;false&quot;&gt;PC&lt;/button&gt;
  &lt;/div&gt;
  &lt;section class=&quot;homeScreenPlatform&quot; data-home-instructions=&quot;android&quot; aria-label=&quot;안드로이드 추가 방법&quot;&gt;
    &lt;ol&gt;&lt;li&gt;&lt;strong&gt;Chrome&lt;/strong&gt;에서 이 지도를 엽니다.&lt;/li&gt;&lt;li&gt;오른쪽 위 &lt;strong&gt;⋮ 메뉴 → 홈 화면에 추가&lt;/strong&gt; 또는 &lt;strong&gt;앱 설치&lt;/strong&gt;를 누릅니다.&lt;/li&gt;&lt;li&gt;&lt;strong&gt;설치 / 추가&lt;/strong&gt;를 확인하면 홈 화면에서 베트남맵 아이콘을 찾을 수 있어요.&lt;/li&gt;&lt;/ol&gt;
    &lt;p&gt;메뉴 이름은 브라우저에 따라 다를 수 있습니다. 이미 아이콘이 있다면 그 아이콘으로 열어주세요.&lt;/p&gt;
  &lt;/section&gt;
  &lt;section class=&quot;homeScreenPlatform&quot; data-home-instructions=&quot;ios&quot; aria-label=&quot;아이폰 추가 방법&quot; hidden=&quot;&quot;&gt;
    &lt;ol&gt;&lt;li&gt;&lt;strong&gt;Safari&lt;/strong&gt;에서 이 지도를 엽니다.&lt;/li&gt;&lt;li&gt;&lt;strong&gt;공유 버튼 → 홈 화면에 추가&lt;/strong&gt;를 누릅니다. 공유 버튼이 안 보이면 페이지 메뉴에서 공유를 선택하세요.&lt;/li&gt;&lt;li&gt;&lt;strong&gt;웹 앱으로 열기&lt;/strong&gt;가 보이면 켠 뒤, 오른쪽 위 &lt;strong&gt;추가&lt;/strong&gt;를 누릅니다.&lt;/li&gt;&lt;/ol&gt;
    &lt;p&gt;홈 화면에 추가 항목이 없으면 공유 메뉴 맨 아래 ‘동작 편집’에서 추가할 수 있어요.&lt;/p&gt;
  &lt;/section&gt;
  &lt;section class=&quot;homeScreenPlatform&quot; data-home-instructions=&quot;desktop&quot; aria-label=&quot;PC 추가 방법&quot; hidden=&quot;&quot;&gt;
    &lt;ol&gt;&lt;li&gt;&lt;strong&gt;Chrome 또는 Edge&lt;/strong&gt;에서 지도를 엽니다.&lt;/li&gt;&lt;li&gt;주소창의 &lt;strong&gt;설치 아이콘&lt;/strong&gt;이나 브라우저 메뉴의 &lt;strong&gt;앱 설치&lt;/strong&gt;를 선택합니다.&lt;/li&gt;&lt;li&gt;휴대폰에도 추가하려면 아래 주소를 휴대폰에서 열고 &lt;strong&gt;안드로이드 / 아이폰 안내&lt;/strong&gt;를 따라주세요.&lt;/li&gt;&lt;/ol&gt;
  &lt;/section&gt;
  &lt;div class=&quot;homeScreenLink&quot;&gt;&lt;input id=&quot;homeScreenLink&quot; type=&quot;text&quot; readonly=&quot;&quot; aria-label=&quot;홈 화면에 추가할 지도 주소&quot; value=&quot;https://viettrip-vietnam-map.pages.dev/&quot;&gt;&lt;button id=&quot;copyHomeScreenLink&quot; type=&quot;button&quot;&gt;주소 복사&lt;/button&gt;&lt;/div&gt;
  &lt;p class=&quot;homeScreenFineprint&quot;&gt;홈 화면 추가는 무료입니다. 지도 이용에는 인터넷 연결이 필요합니다.&lt;/p&gt;
&lt;/dialog&gt;

&lt;dialog id=&quot;nearbyStayDialog&quot; class=&quot;travellerDialog&quot; aria-labelledby=&quot;nearbyStayTitle&quot;&gt;
  &lt;div class=&quot;travellerDialogHead&quot;&gt;&lt;div&gt;&lt;h2 id=&quot;nearbyStayTitle&quot;&gt;숙소 주변 업소 찾기&lt;/h2&gt;&lt;p&gt;숙소를 정하면 가까운 업소부터 보여드려요.&lt;/p&gt;&lt;/div&gt;&lt;button id=&quot;nearbyStayClose&quot; type=&quot;button&quot; aria-label=&quot;숙소 지정 닫기&quot;&gt;×&lt;/button&gt;&lt;/div&gt;
  &lt;div id=&quot;nearbySavedStay&quot; hidden=&quot;&quot;&gt;&lt;p&gt;최근 지정한 숙소&lt;/p&gt;&lt;button id=&quot;nearbyUseSaved&quot; class=&quot;nearbyStayResult&quot; type=&quot;button&quot;&gt;&lt;strong id=&quot;nearbySavedName&quot;&gt;&lt;/strong&gt;&lt;span id=&quot;nearbySavedAddress&quot;&gt;&lt;/span&gt;&lt;small&gt;이 숙소 주변 다시 찾기&lt;/small&gt;&lt;/button&gt;&lt;button id=&quot;nearbyForgetStay&quot; type=&quot;button&quot;&gt;기억한 숙소 삭제&lt;/button&gt;&lt;/div&gt;
  &lt;form id=&quot;nearbyStayForm&quot;&gt;&lt;label for=&quot;nearbyStayQuery&quot;&gt;숙소 이름 또는 주소&lt;/label&gt;&lt;div class=&quot;nearbySearchRow&quot;&gt;&lt;input id=&quot;nearbyStayQuery&quot; type=&quot;search&quot; maxlength=&quot;200&quot; placeholder=&quot;예: 롯데호텔 사이공, 숙소 도로명 주소&quot; autocomplete=&quot;off&quot;&gt;&lt;button id=&quot;nearbyStaySearch&quot; class=&quot;btn primary&quot; type=&quot;submit&quot;&gt;검색&lt;/button&gt;&lt;/div&gt;&lt;/form&gt;
  &lt;p id=&quot;nearbyStayStatus&quot; role=&quot;status&quot;&gt;&lt;/p&gt;&lt;div id=&quot;nearbyStayResults&quot; class=&quot;nearbyStayResults&quot;&gt;&lt;/div&gt;

    &lt;p id=&quot;operatorStatus&quot; class=&quot;memberStatus&quot; role=&quot;status&quot; aria-live=&quot;polite&quot;&gt;&lt;/p&gt;

    &lt;button id=&quot;operatorLogout&quot; class=&quot;operatorLogout&quot; type=&quot;button&quot;&gt;로그아웃&lt;/button&gt;
  &lt;/div&gt;

&lt;dialog id=&quot;memberDialog&quot; class=&quot;travellerDialog memberDialog&quot; data-no-sheet-resize=&quot;&quot; aria-labelledby=&quot;memberTitle&quot;&gt;
  &lt;div class=&quot;travellerDialogHead&quot;&gt;&lt;div&gt;&lt;h2 id=&quot;memberTitle&quot;&gt;내 맵 등급 · 활동&lt;/h2&gt;&lt;p&gt;회원의 경험으로 함께 만드는 지도&lt;/p&gt;&lt;/div&gt;&lt;button id=&quot;memberClose&quot; type=&quot;button&quot; aria-label=&quot;내 활동 닫기&quot;&gt;×&lt;/button&gt;&lt;/div&gt;
  &lt;section class=&quot;memberHero&quot; aria-label=&quot;나의 등급&quot;&gt;
    &lt;span id=&quot;memberHeroName&quot;&gt;나의 맵 활동&lt;/span&gt;&lt;strong id=&quot;memberHeroRank&quot; class=&quot;memberHeroRank&quot;&gt;등급 확인 중&lt;/strong&gt;
    &lt;p&gt;인정된 기여 &lt;b id=&quot;memberTotal&quot;&gt;—&lt;/b&gt;건&lt;/p&gt;&lt;progress id=&quot;memberProgress&quot; max=&quot;1&quot; value=&quot;0&quot; aria-label=&quot;승급 진행률&quot;&gt;&lt;/progress&gt;&lt;p id=&quot;memberNext&quot;&gt;활동 정보를 불러오고 있어요.&lt;/p&gt;
  &lt;/section&gt;
  &lt;div class=&quot;memberDeviceNotice&quot;&gt;&lt;p id=&quot;memberDeviceStatus&quot;&gt;PC·모바일 등급을 동일하게 사용하려면 기기를 연결해 주세요.&lt;/p&gt;&lt;button id=&quot;memberDeviceLinkButton&quot; type=&quot;button&quot;&gt;PC·모바일 연결하기 ›&lt;/button&gt;&lt;/div&gt;
  &lt;p id=&quot;memberStatus&quot; class=&quot;memberStatus&quot; role=&quot;status&quot; aria-live=&quot;polite&quot;&gt;&lt;/p&gt;
  &lt;button id=&quot;memberRefresh&quot; class=&quot;memberRefresh&quot; type=&quot;button&quot;&gt;활동 새로고침&lt;/button&gt;
  &lt;dl class=&quot;memberCounts&quot;&gt;&lt;div&gt;&lt;dt&gt;업소 등록&lt;/dt&gt;&lt;dd id=&quot;memberCount_place&quot;&gt;—&lt;/dd&gt;&lt;/div&gt;&lt;div&gt;&lt;dt&gt;방문 후기&lt;/dt&gt;&lt;dd id=&quot;memberCount_review&quot;&gt;—&lt;/dd&gt;&lt;/div&gt;&lt;div&gt;&lt;dt&gt;정보 수정&lt;/dt&gt;&lt;dd id=&quot;memberCount_correction&quot;&gt;—&lt;/dd&gt;&lt;/div&gt;&lt;/dl&gt;
  &lt;section id=&quot;memberGradeSection&quot; class=&quot;memberSection&quot;&gt;&lt;h3&gt;등급과 승급 기준&lt;/h3&gt;&lt;ol id=&quot;memberGradeSteps&quot; class=&quot;memberGradeSteps&quot;&gt;&lt;/ol&gt;&lt;p class=&quot;memberHelp&quot;&gt;기여량 기준의 맵 등급이며, 카페 계급·혜택과는 별도입니다. 미접속 때문에 등급이 내려가지는 않습니다.&lt;/p&gt;&lt;/section&gt;
  &lt;details class=&quot;memberSection&quot;&gt;&lt;summary&gt;어떤 활동이 인정되나요?&lt;/summary&gt;&lt;ul class=&quot;memberRules&quot;&gt;&lt;li&gt;이름·주소·위치가 있는 새 업소 등록: 업소별 1건&lt;/li&gt;&lt;li&gt;10자 이상으로 경험을 남긴 방문 후기: 업소별 1건. 별점이 낮아도 동일하게 인정합니다.&lt;/li&gt;&lt;li&gt;관리자가 확인한 정보 수정 제안: 업소·항목별 1건&lt;/li&gt;&lt;li&gt;같은 내용의 반복 후기, 중복 업소, 단순 수정·사진 추가는 건수를 늘리지 않습니다.&lt;/li&gt;&lt;li&gt;별점만 남기기·강추·조회·출석·공유에는 기여가 적립되지 않습니다.&lt;/li&gt;&lt;li&gt;삭제되거나 허위·도배로 인정이 취소된 기록은 제외됩니다. 등급은 후기의 정확성을 보증하지 않습니다.&lt;/li&gt;&lt;/ul&gt;&lt;/details&gt;
  &lt;section class=&quot;memberSection&quot;&gt;&lt;h3&gt;내 기여 내역 &lt;small&gt;최근 50건&lt;/small&gt;&lt;/h3&gt;&lt;ul id=&quot;memberActivityList&quot; class=&quot;memberActivityList&quot;&gt;&lt;li&gt;불러오는 중…&lt;/li&gt;&lt;/ul&gt;&lt;/section&gt;
  &lt;details class=&quot;memberSection&quot;&gt;&lt;summary&gt;내 정보 수정 제안&lt;/summary&gt;&lt;ul id=&quot;memberCorrectionList&quot; class=&quot;memberCorrectionList&quot;&gt;&lt;/ul&gt;&lt;/details&gt;
  &lt;details class=&quot;memberSection&quot;&gt;&lt;summary&gt;닉네임 설정&lt;/summary&gt;&lt;form id=&quot;memberNicknameForm&quot;&gt;&lt;label for=&quot;memberNickname&quot;&gt;맵 활동 닉네임&lt;/label&gt;&lt;div class=&quot;memberInputRow&quot;&gt;&lt;input id=&quot;memberNickname&quot; type=&quot;text&quot; maxlength=&quot;30&quot; required=&quot;&quot; autocomplete=&quot;nickname&quot;&gt;&lt;button id=&quot;memberNicknameSave&quot; type=&quot;submit&quot;&gt;저장&lt;/button&gt;&lt;/div&gt;&lt;/form&gt;&lt;/details&gt;
  &lt;details id=&quot;memberDeviceLink&quot; class=&quot;memberSection&quot;&gt;&lt;summary&gt;PC·모바일 연결 · 활동 복구&lt;/summary&gt;
    &lt;p class=&quot;memberHelp&quot;&gt;별도 가입 없이 이 브라우저에서 시작합니다. PC·휴대폰의 활동을 합치려면 기존 기기에서 연결 코드를 만들고, 다른 기기에 입력하세요. 닉네임이 같아도 자동으로 합쳐지지 않습니다.&lt;/p&gt;
    &lt;div class=&quot;memberCodeActions&quot;&gt;&lt;button type=&quot;button&quot; data-member-code=&quot;link&quot;&gt;기기 연결 코드 만들기&lt;/button&gt;&lt;button type=&quot;button&quot; data-member-code=&quot;recovery&quot;&gt;복구 코드 발급&lt;/button&gt;&lt;/div&gt;
    &lt;p id=&quot;memberRecoveryNote&quot; class=&quot;memberHelp&quot;&gt;브라우저 기록을 지우기 전에 복구 코드를 보관해 주세요.&lt;/p&gt;
    &lt;div id=&quot;memberCodeBox&quot; hidden=&quot;&quot;&gt;&lt;p id=&quot;memberCodeHelp&quot; class=&quot;memberHelp&quot;&gt;&lt;/p&gt;&lt;div class=&quot;memberInputRow&quot;&gt;&lt;input id=&quot;memberCode&quot; type=&quot;text&quot; readonly=&quot;&quot; autocomplete=&quot;off&quot; spellcheck=&quot;false&quot; aria-label=&quot;발급된 연결 또는 복구 코드&quot; data-no-sheet-drag=&quot;&quot;&gt;&lt;button id=&quot;memberCopyCode&quot; type=&quot;button&quot;&gt;복사&lt;/button&gt;&lt;/div&gt;&lt;/div&gt;
    &lt;form id=&quot;memberConnectForm&quot;&gt;&lt;label for=&quot;memberConnectCode&quot;&gt;다른 기기의 연결 코드 또는 보관한 복구 코드&lt;/label&gt;&lt;input id=&quot;memberConnectCode&quot; type=&quot;text&quot; required=&quot;&quot; maxlength=&quot;100&quot; autocomplete=&quot;off&quot; spellcheck=&quot;false&quot; placeholder=&quot;VM-으로 시작하는 코드&quot; data-no-sheet-drag=&quot;&quot;&gt;&lt;label class=&quot;memberMerge&quot;&gt;&lt;input id=&quot;memberMerge&quot; type=&quot;checkbox&quot; required=&quot;&quot;&gt;현재 기기의 활동을 해당 회원 활동과 합칩니다.&lt;/label&gt;&lt;button id=&quot;memberConnect&quot; type=&quot;submit&quot;&gt;내 활동 연결&lt;/button&gt;&lt;/form&gt;
    &lt;p class=&quot;memberHelp&quot;&gt;코드는 본인만 보관해 주세요. 연결된 기기와 복구 코드가 모두 없으면 닉네임만으로 활동을 복구할 수 없습니다.&lt;/p&gt;
  &lt;/details&gt;
&lt;/dialog&gt;
&lt;dialog id=&quot;mapCorrectionDialog&quot; class=&quot;travellerDialog memberDialog&quot; aria-labelledby=&quot;mapCorrectionTitle&quot;&gt;

  &lt;form id=&quot;mapCorrectionForm&quot;&gt;&lt;input id=&quot;correctionPlaceId&quot; type=&quot;hidden&quot;&gt;&lt;label for=&quot;correctionKind&quot;&gt;어떤 정보가 달라졌나요?&lt;/label&gt;&lt;select id=&quot;correctionKind&quot;&gt;&lt;option value=&quot;address&quot;&gt;주소·위치&lt;/option&gt;&lt;option value=&quot;hours&quot;&gt;영업시간&lt;/option&gt;&lt;option value=&quot;closed&quot;&gt;폐업·휴업&lt;/option&gt;&lt;option value=&quot;other&quot;&gt;기타 정보&lt;/option&gt;&lt;/select&gt;&lt;label for=&quot;correctionBody&quot;&gt;확인한 내용&lt;/label&gt;&lt;textarea id=&quot;correctionBody&quot; minlength=&quot;10&quot; maxlength=&quot;1000&quot; required=&quot;&quot; rows=&quot;4&quot; placeholder=&quot;바뀐 정보와 확인한 날짜·근거를 적어주세요.&quot;&gt;&lt;/textarea&gt;&lt;p class=&quot;memberHelp&quot;&gt;관리자 확인 후 기여 1건으로 인정됩니다. 접수만으로 업소 정보가 변경되지는 않습니다.&lt;/p&gt;&lt;button id=&quot;correctionSave&quot; type=&quot;submit&quot;&gt;제안 보내기&lt;/button&gt;&lt;p id=&quot;correctionStatus&quot; role=&quot;status&quot; aria-live=&quot;polite&quot;&gt;&lt;/p&gt;&lt;/form&gt;
&lt;/dialog&gt;

&lt;section id=&quot;chatDock&quot; class=&quot;chatDock&quot; aria-label=&quot;회원 채팅과 AI 질문&quot;&gt;

      &lt;div class=&quot;chatConnection&quot;&gt;&lt;span id=&quot;chatStatus&quot; role=&quot;status&quot;&gt;채팅을 열면 연결합니다.&lt;/span&gt;&lt;button id=&quot;chatRetry&quot; type=&quot;button&quot;&gt;다시 연결&lt;/button&gt;&lt;/div&gt;

      &lt;div id=&quot;chatMessages&quot; role=&quot;log&quot; aria-label=&quot;회원 채팅 메시지&quot; aria-live=&quot;polite&quot; aria-relevant=&quot;additions&quot;&gt;&lt;/div&gt;
      &lt;form id=&quot;chatForm&quot; autocomplete=&quot;off&quot;&gt;&lt;label class=&quot;chatNickname&quot;&gt;닉네임&lt;input id=&quot;chatNickname&quot; maxlength=&quot;30&quot; required=&quot;&quot; autocomplete=&quot;nickname&quot; placeholder=&quot;공개 닉네임&quot;&gt;&lt;/label&gt;&lt;div class=&quot;chatCompose&quot;&gt;&lt;textarea id=&quot;chatMessage&quot; maxlength=&quot;1000&quot; rows=&quot;2&quot; required=&quot;&quot; aria-label=&quot;공개 채팅 메시지&quot; placeholder=&quot;회원들과 이야기해 보세요 (최대 1,000자)&quot;&gt;&lt;/textarea&gt;&lt;button id=&quot;chatSend&quot; type=&quot;submit&quot;&gt;보내기&lt;/button&gt;&lt;/div&gt;&lt;small&gt;Enter 전송 · Shift+Enter 줄바꿈&lt;/small&gt;&lt;/form&gt;
    &lt;/section&gt;
    &lt;section id=&quot;aiChat&quot; role=&quot;tabpanel&quot; aria-labelledby=&quot;aiTab&quot; hidden=&quot;&quot;&gt;&lt;p class=&quot;chatNotice&quot;&gt;AI 질문과 답변은 다른 회원에게 공개되지 않습니다.&lt;/p&gt;
    &lt;section class=&quot;aiMapSearch&quot; aria-label=&quot;AI에게 업소 질문하기&quot;&gt;
      &lt;form id=&quot;aiMapForm&quot; class=&quot;aiComposer&quot; autocomplete=&quot;off&quot;&gt;
        &lt;label for=&quot;aiMapQuestion&quot;&gt;AI&lt;/label&gt;
        &lt;input id=&quot;aiMapQuestion&quot; type=&quot;text&quot; maxlength=&quot;300&quot; autocomplete=&quot;off&quot; aria-label=&quot;AI에게 찾고 싶은 업소 질문하기&quot; aria-controls=&quot;aiMapPanel&quot; aria-expanded=&quot;false&quot; placeholder=&quot;오늘 여자친구와 갈 만한 1군 분위기 좋은 바 찾아줘&quot;&gt;
        &lt;button id=&quot;aiMapClear&quot; class=&quot;searchClear&quot; type=&quot;button&quot; aria-label=&quot;AI 질문 지우기&quot; hidden=&quot;&quot;&gt;×&lt;/button&gt;
        &lt;button id=&quot;aiMapSend&quot; type=&quot;submit&quot; aria-label=&quot;AI에게 질문 보내기&quot; disabled=&quot;&quot;&gt;질문&lt;/button&gt;
      &lt;/form&gt;
      &lt;section id=&quot;aiMapPanel&quot; class=&quot;aiPanel&quot; aria-label=&quot;AI 업소 검색&quot; hidden=&quot;&quot;&gt;
        &lt;div class=&quot;aiPanelHead&quot;&gt;&lt;strong id=&quot;aiMapTitle&quot;&gt;이렇게 물어보세요&lt;/strong&gt;&lt;button id=&quot;aiMapClose&quot; type=&quot;button&quot; aria-label=&quot;AI 검색 결과 닫기&quot;&gt;×&lt;/button&gt;&lt;/div&gt;
        &lt;div id=&quot;aiMapExamples&quot; class=&quot;aiExamples&quot;&gt;
          &lt;button type=&quot;button&quot;&gt;오늘 여자친구와 갈 만한 1군에서 분위기 좋은 바를 찾아줘&lt;/button&gt;
          &lt;button type=&quot;button&quot;&gt;호치민에서 회원 혜택이 있는 마사지 찾아줘&lt;/button&gt;
          &lt;button type=&quot;button&quot;&gt;하노이에서 회원들이 강추한 식당 찾아줘&lt;/button&gt;
          &lt;button type=&quot;button&quot;&gt;호치민에서 달랏으로 가는 교통편 찾아줘&lt;/button&gt;
        &lt;/div&gt;
        &lt;p id=&quot;aiMapStatus&quot; role=&quot;status&quot; aria-live=&quot;polite&quot;&gt;&lt;/p&gt;
        &lt;ul id=&quot;aiMapResults&quot; class=&quot;aiResults&quot; aria-label=&quot;회원 등록 업소와 Google 검색 결과&quot;&gt;&lt;/ul&gt;
        &lt;p id=&quot;aiMapNote&quot; class=&quot;aiNote&quot;&gt;회원 등록 업소를 먼저, Google 지도 업소를 함께 찾아요.&lt;/p&gt;
      &lt;/section&gt;
    &lt;/section&gt;
    &lt;/section&gt;
  &lt;/div&gt;
